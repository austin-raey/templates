packages:
  - config/oxc
  - template/*

catalogMode: prefer

catalog:
  "@types/node": "26.6.5"
  "oxfmt": "0.73.0"
  "oxlint": "1.88.0"
  "oxlint-tsgolint": "7.0.2004"
  "typescript": "7.0.2"
  "vite-plus": "1.3.0"
  "vite": "npm:@voidzero-dev/vite-plus-core@1.3.0"

catalogs:
  plugins:
    "@unocss/eslint-plugin": "66.11.0"
    "eslint-plugin-better-tailwindcss": "4.9.1"
    "eslint-plugin-perfectionist": "5.12.1"

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@slowpoketail/oxc@1.3.0"
