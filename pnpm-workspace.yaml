packages:
  - packages/oxc
  - template/*

catalogMode: prefer

catalog:
  "@types/node": "26.6.6"
  "oxfmt": 0.75.0
  "oxlint": 1.90.0
  "oxlint-tsgolint": 7.0.2005
  "typescript": "7.0.2"
  "vite-plus": 1.4.0
  "vite": "npm:@voidzero-dev/vite-plus-core@1.4.0"

catalogs:
  plugins:
    "@unocss/eslint-plugin": "66.12.0"
    "eslint-plugin-better-tailwindcss": "4.10.0"
    "eslint-plugin-perfectionist": 5.13.0

overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@slowpoketail/oxc@1.3.0"
